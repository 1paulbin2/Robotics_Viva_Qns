<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arduino & ROS 2 Viva Quiz</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2233;--mu:#667085;--bd:#dde2ee;--ac:#4f46e5;--ok:#16a34a;--okb:#e8f7ee;--no:#dc2626;--nob:#fdecec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mu:#98a2b8;--bd:#2a3250;--ac:#818cf8;--okb:#12301f;--nob:#3a1717}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mu:#98a2b8;--bd:#2a3250;--ac:#818cf8;--okb:#12301f;--nob:#3a1717}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.q{font-size:1.15rem;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt b{min-width:22px;color:var(--ac)}
.opt.sel{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:6px 0 14px}
.fb.ok{background:var(--okb);border-left:5px solid var(--ok)}
.fb.no{background:var(--nob);border-left:5px solid var(--no)}
.fb strong{display:block;font-size:1.05rem}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
.btn.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.btn:disabled{opacity:.4;cursor:default}
details{margin-top:14px}summary{cursor:pointer;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 0;cursor:pointer;font:inherit;font-size:.85rem}
.grid .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid .no{background:var(--no);color:#fff;border-color:var(--no)}
.grid .cur{outline:2px solid var(--ac)}
.res{text-align:center}.big{font-size:2.6rem;font-weight:800;margin:6px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stats div{background:var(--bg);border-radius:12px;padding:10px 18px;min-width:110px}
.stats b{display:block;font-size:1.4rem}
.hide{display:none}
</style></head><body><div class="w">
<h1>⚡ Arduino & ROS 2 Practical Viva Quiz</h1>
<div id="quiz" class="card">
<div class="top"><span id="qn"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<p class="q" id="qt"></p><div id="opts"></div><div id="fb"></div>
<div class="nav"><button class="btn g" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>
<details><summary>Question navigator</summary><div class="grid" id="grid"></div></details>
</div>
<div id="result" class="card res hide"></div>
</div>
<script>
const RAW=`What command is used to build a ROS 2 workspace?~colcon build~catkin_make~ament build~cmake build
What does ROS stand for?~Robot Operating System~Robotic Operation Software~Robot Orchestration Suite~Real-time Operating System
What is the velocity message type used to move a robot or turtle in ROS 2?~geometry_msgs/msg/Twist~geometry_msgs/msg/Pose~std_msgs/msg/Float32~nav_msgs/msg/Odometry
What type of information does the MPU6050 provide for gesture control?~Motion/acceleration and orientation-related sensor data.~Temperature and humidity readings.~Distance and proximity measurements.~Light intensity and colour data.
What is the purpose of a ROS 2 subscriber?~To receive messages published on a topic.~To send messages to a topic.~To provide a request-response service.~To compile a ROS 2 package.
What two parameters are measured by the DHT11?~Temperature and humidity~Pressure and altitude~Light and distance~Acceleration and rotation
Which ROS 2 stack is used for autonomous navigation?~Navigation2~MoveIt2~Cartographer~Gazebo
Which ROS 2 package is used for the service and client experiment?~py_srvcli~pubsub~py_actcli~turtlesim
What is the purpose of Cartographer?~It performs SLAM by generating a map while determining the robot's location.~It simulates the robot in a 3D physical world.~It visualizes sensor data in a GUI.~It records topic data to a bag file.
What is the main purpose of the LDR experiment?~To measure light intensity and control LED brightness based on the light level.~To measure distance and rotate a servo based on the reading.~To measure temperature and show it on an OLED display.~To detect a line and steer a robot along it.
What communication method in ROS 2 is suitable for long-running tasks with feedback?~Action~Service~Topic~Parameter
Which library is used for the OLED display?~Adafruit_SSD1306~Adafruit_MPU6050~LiquidCrystal_I2C~Adafruit_NeoPixel
What command is used to create a ROS 2 package?~ros2 pkg create~ros2 node create~colcon create~ros2 run create
Which function measures the duration of the HC-SR04 echo pulse?~pulseIn()~analogRead()~digitalRead()~millis()
What is the purpose of the map() function in Arduino?~It rescales a value from one range to another.~It restricts a value within a range.~It generates a PWM output.~It pauses the program for a set time.
Which package is used for SLAM in the TurtleBot3 experiment?~Cartographer~Navigation2~RViz2~Gazebo
Which command is used to run the publisher node?~ros2 run pubsub talker~ros2 run pubsub listener~ros2 launch pubsub talker~ros2 node run talker
What is the main purpose of the HC-SR04 ultrasonic sensor?~To measure distance.~To measure light.~To measure temperature.~To measure acceleration.
What is the message type used in the ROS 2 publisher example?~std_msgs/msg/String~std_msgs/msg/Int32~std_msgs/msg/Float64~std_msgs/msg/Bool
What is the purpose of the setup() function in Arduino?~It runs once when the Arduino starts.~It runs repeatedly forever.~It runs only when an interrupt occurs.~It runs when serial data arrives.
Which motor driver is used in the robot experiments?~L293~L298N~ULN2003~TB6612
What is the I²C address of the OLED used in the experiment?~0x3C~0x68~0x27~0x76
Which library is used for DHT11 interfacing?~DHT.h~Servo.h~Wire.h~SPI.h
Which tool is used to visualize sensor data and maps in ROS 2?~RViz2~rqt_graph~Gazebo~Cartographer
Which topic is used to move the turtle in Turtlesim?~/turtle1/cmd_vel~/turtle1/pose~/turtle1/color_sensor~/turtle1/rotate_absolute
Which command launches TurtleBot3 keyboard teleoperation?~ros2 run turtlebot3_teleop teleop_keyboard~ros2 launch turtlebot3_teleop teleop_keyboard~ros2 run turtlebot3_gazebo teleop_keyboard~ros2 run turtlesim teleop_key
Which Arduino function pauses the program for a specified time?~delay()~pulseIn()~millis()~constrain()
What is the name of the publisher node in the example?~talker~listener~publisher_node~minimal_pub
Which Arduino board is used in the experiments?~Arduino Uno~Arduino Mega~Arduino Nano~Arduino Leonardo
What library is used to control a servo motor?~Servo.h~Stepper.h~Wire.h~DHT.h
What is the angle range of the SG90 servo used in the lab?~0° to 180°~0° to 90°~0° to 270°~0° to 360°
What is the main purpose of the ultrasonic-servo experiment?~To rotate the servo according to the distance measured by the ultrasonic sensor.~To rotate the servo according to the light level measured by the LDR.~To display the measured distance on an OLED screen.~To drive DC motors based on IR sensor input.
What does SLAM stand for?~Simultaneous Localization and Mapping.~Sequential Localization and Motion planning.~Simultaneous Learning and Mapping.~Synchronized Localization and Monitoring.
What is the resolution of the OLED display?~128 × 64 pixels~128 × 32 pixels~64 × 48 pixels~192 × 64 pixels
What is the purpose of RPLidar C1 in the ROS 2 experiment?~To acquire LiDAR scan data from the surrounding environment.~To capture camera images of the environment.~To measure the robot's orientation.~To drive the robot's wheel motors.
What topic publishes RPLidar C1 scan data?~/scan~/map~/odom~/cmd_vel
What is the timer period used by the publisher program?~0.5 seconds.~1.0 seconds.~0.1 seconds.~2.0 seconds.
What sensor is used to measure temperature and humidity?~DHT11~HC-SR04~MPU6050~LDR
What type of data does the ROS 2 publisher example publish?~String data.~Integer data.~Float data.~Boolean data.
Which Arduino pin is used for the analog output of the LDR?~A0~A1~A2~A5
What is the range of values returned by analogRead() on Arduino Uno?~0 to 1023~0 to 255~0 to 4095~0 to 511
What is the smallest executable unit in ROS 2?~Node~Topic~Package~Message
What is the resistor value used in series with the LED?~220 Ω~100 Ω~1 kΩ~10 kΩ
Which tool is used to visualize nodes and topics as a graph?~rqt_graph~RViz2~rqt_plot~Gazebo
What communication protocol is used by the MPU6050?~I²C~SPI~UART~CAN
What operation does the AddTwoInts service perform?~It adds two integers.~It multiplies two integers.~It subtracts two integers.~It compares two integers.
What is the purpose of Gazebo in the TurtleBot3 experiment?~It provides a simulated environment for testing the robot.~It generates maps using LiDAR data.~It visualizes topic data as graphs.~It plans paths to navigation goals.
When light intensity increases, what happens to the resistance of an LDR?~Its resistance decreases.~Its resistance increases.~Its resistance stays constant.~Its resistance first rises, then falls.
What happens when both IR sensors detect the forward condition in the given program?~The robot moves forward.~The robot turns left.~The robot turns right.~The robot stops.
Which sensor is used in a line follower robot?~IR sensor~Ultrasonic sensor~LDR~DHT11
How often is the DHT11/OLED display updated in the program?~Every 2 seconds.~Every 1 second.~Every 5 seconds.~Every 500 milliseconds.
Which command selects the TurtleBot3 Burger model?~export TURTLEBOT3_MODEL=burger~export TURTLEBOT3_MODEL=waffle~export TURTLEBOT3_MODEL=waffle_pi~export TURTLEBOT3_MODEL=turtle
How long is the trigger pulse applied to the HC-SR04?~10 microseconds.~2 microseconds.~100 microseconds.~1 millisecond.
Which Arduino pin is connected to TRIG of the HC-SR04?~D9~D8~D10~D11
Which microcontroller is used on the Arduino Uno?~ATmega328P~ATmega2560~ATmega32U4~ATtiny85
What command is used to source a ROS 2 workspace?~source install/setup.bash~source build/setup.bash~source src/setup.bash~source /opt/ros/setup.bash
What command is used to list active ROS 2 nodes?~ros2 node list~ros2 topic list~ros2 service list~ros2 pkg list
What does the IR sensor detect in the line follower experiment?~The presence or absence of the line.~The distance to an obstacle.~The light level of the room.~The temperature of the surface.
Which Arduino pins are used for the left and right IR sensors?~D7 and D8~D2 and D3~D9 and D10~A0 and A1
Which pins control the motors through the L293 in the line follower experiment?~D2, D3, D4 and D5~D6, D7, D8 and D9~D3, D5, D6 and D9~D4, D5, D6 and D7
What baud rate is used in the LDR experiment?~9600~4800~19200~115200
Which file contains console_scripts entries in a Python ROS 2 package?~setup.py~package.xml~setup.cfg~CMakeLists.txt
What is the main function of the L293 motor driver?~It controls/drives the DC motors.~It measures motor speed.~It regulates the 5 V supply.~It reads line sensor data.
What is the purpose of the loop() function?~It repeatedly executes the Arduino program.~It executes the program only once at startup.~It declares global variables.~It configures pin modes only.
What service is used to add a second turtle in Turtlesim?~/spawn~/kill~/reset~/clear
What type of output does the DO pin of the IR sensor provide?~Digital HIGH/LOW~Analog voltage 0–1023~PWM signal~I²C data
Which Arduino pin is SCL on the Uno?~A5~A4~A3~A0
Which sensor is used in the gesture-controlled robot experiment?~MPU6050~DHT11~HC-SR04~LDR
Which ROS 2 package is used for the publisher and subscriber experiment?~pubsub~py_srvcli~turtlesim~demo_nodes
Which Arduino pin is connected to ECHO of the HC-SR04?~D10~D8~D11~D12
Which RViz2 display is used to visualize RPLidar data?~LaserScan.~PointCloud2.~Odometry.~Image.
What is the name of the subscriber node in the example?~listener~talker~subscriber_node~minimal_sub
What do gray or unexplored areas represent in the SLAM map?~Areas that have not yet been mapped.~Detected obstacles.~Free and traversable space.~The robot's planned path.
What command is used to record ROS 2 topic data?~ros2 bag record~ros2 topic record~ros2 bag save~ros2 topic echo
What do black areas represent in the SLAM map?~Detected obstacles.~Free and traversable space.~Areas not yet mapped.~The robot's travelled path.
What Ubuntu version is used with ROS 2 Humble in the lab?~Ubuntu 22.04~Ubuntu 20.04~Ubuntu 18.04~Ubuntu 24.04
What do white areas represent in the SLAM map?~Free and traversable space.~Detected obstacles.~Areas not yet mapped.~The robot's planned path.
What is the purpose of the pinMode() function?~It configures an Arduino pin as INPUT or OUTPUT.~It reads the value of a digital pin.~It writes a PWM value to a pin.~It attaches a servo to a pin.
Which Arduino function generates PWM output?~analogWrite()~analogRead()~digitalWrite()~tone()
Which pin is used for the LED in the LDR experiment?~D11~D3~D5~D9
What happens to the servo angle when the measured distance changes?~The servo angle changes according to the measured distance.~The servo stays fixed at 90°.~The servo rotates continuously at constant speed.~The servo switches off.
What range is used for LED brightness after mapping the LDR value?~0 to 255~0 to 1023~0 to 180~0 to 100
Which command is used to run the subscriber node?~ros2 run pubsub listener~ros2 run pubsub talker~ros2 launch pubsub listener~ros2 topic listener
Which Arduino pins are used for I²C communication with the OLED?~A4 (SDA) and A5 (SCL)~A0 (SDA) and A1 (SCL)~D2 (SDA) and D3 (SCL)~A5 (SDA) and A4 (SCL)
What is the purpose of a ROS 2 publisher?~To send messages to a topic.~To receive messages from a topic.~To provide a request-response service.~To visualize topic data.
Which library is used for the MPU6050?~Adafruit_MPU6050.h~Adafruit_SSD1306.h~DHT.h~Servo.h
What is the constant used to convert HC-SR04 echo time to centimetres?~0.034~0.34~0.0034~3.4
Which pin of the HC-SR04 receives the trigger pulse?~TRIG pin~ECHO pin~VCC pin~GND pin
Which ROS 2 distribution is used in the lab?~ROS 2 Humble~ROS 2 Foxy~ROS 2 Iron~ROS 2 Jazzy
Which ROS 2 communication mechanism is used for request-response communication?~Service~Topic~Action~Parameter
Which Arduino pins connect the MPU6050 through I²C?~A4 and A5~A0 and A1~D2 and D3~A2 and A3
Which Arduino pin is connected to the SG90 servo signal?~D6~D5~D9~D10
What is the communication protocol used by the OLED display?~I²C~SPI~UART~1-Wire
Which folder contains source packages in a ROS 2 workspace?~src~build~install~log
Which function restricts a sensor value within a specified range?~constrain()~map()~abs()~min()
Which Arduino pin is used for the DHT11 DATA connection?~D2~D3~D4~D7
What is the purpose of gesture control in the robot experiment?~To control robot movement using gestures or movements detected by the MPU6050.~To control robot movement using obstacles detected by the ultrasonic sensor.~To control robot movement using the line detected by IR sensors.~To control robot movement using light levels measured by the LDR.
Which simulator is used for TurtleBot3?~Gazebo~RViz2~Cartographer~Turtlesim`;
const BANK=RAW.split("\n").map(l=>{const p=l.split("~");return{q:p[0],a:p[1],o:p.slice(1)}});
const $=id=>document.getElementById(id),L="ABCD";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,ans,cur;
function start(){Q=shuffle(BANK).map(x=>({q:x.q,a:x.a,o:shuffle(x.o)}));ans=Array(Q.length).fill(null);cur=0;
$("result").classList.add("hide");$("quiz").classList.remove("hide");render();window.scrollTo(0,0)}
const score=()=>ans.reduce((s,v,i)=>s+(v!==null&&Q[i].o[v]===Q[i].a),0);
const done=()=>ans.filter(v=>v!==null).length;
function render(){const q=Q[cur],n=Q.length,sel=ans[cur];
$("qn").textContent=`Question ${cur+1} of ${n}`;$("sc").textContent=`Score: ${score()} / ${done()}`;
$("pb").style.width=(done()/n*100)+"%";$("qt").textContent=q.q;
$("opts").innerHTML="";
q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";
if(sel!==null){b.disabled=true;if(t===q.a)b.classList.add("ok");else if(i===sel)b.classList.add("no")}
b.innerHTML=`<b>${L[i]}.</b><span></span>`;b.lastChild.textContent=t;b.onclick=()=>{if(ans[cur]===null){ans[cur]=i;render()}};$("opts").appendChild(b)});
const f=$("fb");f.innerHTML="";
if(sel!==null){const ok=q.o[sel]===q.a;f.className="fb "+(ok?"ok":"no");
f.innerHTML=`<strong>${ok?"✅ Correct!":"❌ Incorrect"}</strong><span></span>`;
f.lastChild.textContent=ok?`Correct answer: ${q.a}`:`Correct answer: ${L[q.o.indexOf(q.a)]}. ${q.a}`}else f.className="";
$("prev").disabled=cur===0;
const last=cur===n-1;$("next").textContent=last?"Submit Quiz ✔":"Next →";$("next").disabled=!last&&sel===null&&false;
const g=$("grid");g.innerHTML="";
Q.forEach((x,i)=>{const b=document.createElement("button");b.textContent=i+1;
if(ans[i]!==null)b.className=x.o[ans[i]]===x.a?"ok":"no";if(i===cur)b.classList.add("cur");
b.onclick=()=>{cur=i;render()};g.appendChild(b)})}
$("prev").onclick=()=>{if(cur>0){cur--;render()}};
$("next").onclick=()=>{if(cur<Q.length-1){cur++;render();return}
const un=Q.length-done();if(un&&!confirm(`${un} question(s) unanswered. Submit anyway? They count as incorrect.`))return;finish()};
function finish(){const s=score(),n=Q.length,pct=Math.round(s/n*100),att=done();
const msg=pct>=90?"🏆 Outstanding! You're viva-ready.":pct>=75?"🎉 Great job! Just polish a few topics.":pct>=50?"👍 Decent start. Review the missed questions and retry.":"📚 Keep practising — revisit the lab notes and try again.";
$("quiz").classList.add("hide");const r=$("result");r.classList.remove("hide");
r.innerHTML=`<h2>Quiz Complete</h2><div class="big">Final Score: ${s} / ${n}</div><div>Accuracy: ${pct}%</div>
<div class="stats"><div><b>${s}</b>Correct</div><div><b>${n-s}</b>Incorrect</div><div><b>${n-att}</b>Unanswered</div></div>
<p>${msg}</p><button class="btn" id="again">Restart Quiz (new shuffle)</button> <button class="btn g" id="rev">Review Answers</button>`;
$("again").onclick=start;$("rev").onclick=()=>{r.classList.add("hide");$("quiz").classList.remove("hide");cur=0;render()}}
start();
</script></body></html>
